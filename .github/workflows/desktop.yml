name: Windows credential-stash diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: stash-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-a
          - os: windows-2022
            name: windows-b
          - os: ubuntu-22.04
            name: linux-control
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.3'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked
      - name: Observe native delete-pending directory behavior
        run: uv run --no-sync python stash_windows_probe.py
      - name: Repeat existing concurrent and serialized stash tests with traceback capture
        run: |
          status=0
          for attempt in $(seq 1 24); do
            echo "STASH_REPLICA=$attempt"
            uv run --no-sync pytest -n 0 -s -p stash_trace tests/test_switcher.py::TestStashManifestConcurrentMutation || status=1
          done
          exit "$status"
