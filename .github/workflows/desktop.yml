name: Desktop installers

on:
  pull_request:
    paths:
      - desktop/**
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml
      - .github/workflows/desktop-build.yml
      - .github/workflows/release.yml
      - .github/scripts/desktop_release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      mode: preview
