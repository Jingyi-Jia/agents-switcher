name: Desktop installers

on:
  pull_request:
    paths:
      - desktop/**
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop.yml
      - .github/workflows/desktop-build.yml
      - .github/workflows/release.yml
      - .github/scripts/desktop_release.py
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Optional successful community release run whose existing installers should be tested instead of building previews
        type: string
        default: ""
      verification_source_sha:
        description: Full reviewed main SHA of that release run
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ !inputs.verification_run_id }}
    uses: ./.github/workflows/desktop-build.yml
    with:
      mode: preview
  verify-installers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_run_id != '' }}
    name: Install released ${{ matrix.platform }}-${{ matrix.arch }}
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2022
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RELEASE_RUN: ${{ inputs.verification_run_id }}
      RELEASE_SOURCE: ${{ inputs.verification_source_sha }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Validate the existing release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python desktop/scripts/smoke_installers.py --run-id "$RELEASE_RUN" --source-sha "$RELEASE_SOURCE" --check-run
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: installer-artifacts
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
      - name: Verify provenance, install, and launch the actual release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python desktop/scripts/smoke_installers.py --run-id "$RELEASE_RUN" --source-sha "$RELEASE_SOURCE" --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH" --directory installer-artifacts --disposable-runner
      - name: Diagnose stalled Windows installer processes
        if: failure() && matrix.platform == 'win'
        timeout-minutes: 1
        continue-on-error: true
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -OperationTimeoutSec 15 |
            Where-Object {
              $_.Name -match '^(powershell|pwsh|Agent Switch|Agent-Switch-.*|release-uninstaller|Un_A|Au_)\.exe$'
            } |
            Select-Object Name, ProcessId, ParentProcessId, ExecutablePath,
              @{Name='AgeSeconds'; Expression={[int]((Get-Date) - $_.CreationDate).TotalSeconds}},
              @{Name='InstallerProbe'; Expression={
                if ($_.CommandLine -like '*Get-Command Get-CimInstance*') { 'PowerShell availability' }
                elseif ($_.CommandLine -like '*Get-ExecutionPolicy -Scope Process*') { 'PowerShell execution policy' }
                elseif ($_.CommandLine -like '*Get-CimInstance -ClassName Win32_Process*' -and $_.CommandLine -like '*Stop-Process*') { 'NSIS process stop' }
                elseif ($_.CommandLine -like '*Get-CimInstance -ClassName Win32_Process*') { 'NSIS process detection' }
                else { 'Not an NSIS PowerShell probe' }
              }} |
            ConvertTo-Json -Depth 3
      - name: Compare Windows PowerShell process-probe environments
        if: failure() && matrix.platform == 'win'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          uv run --no-project python - <<'PY'
          import json
          import os
          from pathlib import Path
          import runpy
          import subprocess
          import tempfile
          import time

          allowed = {
              "PATH", "SYSTEMROOT", "SYSTEMDRIVE", "WINDIR", "COMSPEC", "PATHEXT",
              "USERNAME", "USERDOMAIN", "COMPUTERNAME", "USERPROFILE", "HOMEDRIVE", "HOMEPATH",
              "APPDATA", "LOCALAPPDATA", "PROGRAMDATA", "PROGRAMFILES", "PROGRAMFILES(X86)",
              "PROGRAMW6432", "COMMONPROGRAMFILES", "COMMONPROGRAMFILES(X86)", "COMMONPROGRAMW6432",
              "PSMODULEPATH", "TEMP", "TMP", "PROCESSOR_ARCHITECTURE", "NUMBER_OF_PROCESSORS",
          }
          native = {key: value for key, value in os.environ.items() if key.upper() in allowed}
          windows = Path(os.environ["SystemRoot"])
          query = "$null = Get-CimInstance -ClassName Win32_Process; exit 0"
          with tempfile.TemporaryDirectory(prefix="agent-switch-probe-") as temporary:
              isolated = runpy.run_path("desktop/scripts/smoke_backend.py")["isolated_environment"](Path(temporary))
              for name, directory, environment, flags in [
                  ("isolated-x86", "SysWOW64", isolated, []),
                  ("native-x86", "SysWOW64", native, []),
                  ("isolated-x86-no-profile", "SysWOW64", isolated, ["-NoProfile", "-NonInteractive"]),
                  ("native-x64", "System32", native, ["-NoProfile", "-NonInteractive"]),
              ]:
                  executable = windows / directory / "WindowsPowerShell/v1.0/powershell.exe"
                  started = time.monotonic()
                  try:
                      result = subprocess.run(
                          [str(executable), *flags, "-C", query], env=environment,
                          stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          timeout=40, check=False,
                      )
                      outcome = {"exitCode": result.returncode}
                  except subprocess.TimeoutExpired:
                      outcome = {"timedOut": True}
                  print(json.dumps({"probe": name, "seconds": round(time.monotonic() - started, 2), **outcome}), flush=True)
          PY
