name: Windows credential-stash diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: stash-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-2025-a
          - os: windows-latest
            name: windows-2025-b
          - os: windows-2022
            name: windows-2022-control
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.3'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked
      - name: Observe native delete-pending directory behavior
        run: uv run --no-sync python stash_windows_probe.py
      - name: Repeat existing concurrent and serialized stash tests with traceback capture
        run: |
          status=0
          for attempt in $(seq 1 24); do
            echo "STASH_REPLICA=$attempt"
            uv run --no-sync python -m pytest -n 0 -s -p stash_trace tests/test_switcher.py::TestStashManifestConcurrentMutation || status=1
          done
          exit "$status"
      - name: Repeat the full original parallel workload with failure tracebacks
        if: always()
        run: |
          status=0
          for attempt in $(seq 1 3); do
            echo "FULL_SUITE_REPLICA=$attempt"
            uv run --no-sync python -m pytest -p stash_trace -m 'not native_process' -o faulthandler_timeout=600 || status=1
          done
          exit "$status"
  signing-readiness:
    runs-on: ubuntu-22.04
    steps:
      - name: Check only the presence of required release secrets
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER WINDOWS_CERTIFICATE_PFX WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -n "${!name}" ]; then
              printf '%s: configured\n' "$name"
            else
              printf '%s: missing\n' "$name"
            fi
          done
