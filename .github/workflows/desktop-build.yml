name: Native desktop build

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: preview
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      WINDOWS_CERTIFICATE_PFX:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install locked build dependencies
        run: |
          uv sync --locked --group desktop-build
          npm ci --prefix desktop
      - name: Validate the build mode and trusted release source
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          uv run --no-sync python .github/scripts/desktop_release.py source --mode "$BUILD_MODE" --source-sha "$GITHUB_SHA"
      - name: Test Python backend
        run: uv run --no-sync pytest -m "not native_process" -o faulthandler_timeout=600
        timeout-minutes: 15
      - name: Test native process probes without competing test workers
        run: uv run --no-sync pytest -n 0 -m native_process -o faulthandler_timeout=600
        timeout-minutes: 15
      - name: Test Electron shell
        run: npm test --prefix desktop
      - name: Build frozen backend
        run: uv run --no-sync python desktop/scripts/build_backend.py
      - name: Smoke-test frozen backend in disposable account directories
        run: uv run --no-sync python desktop/scripts/smoke_backend.py --disposable-runner --check-tls --check-processes
      - name: Build unsigned preview installers
        if: inputs.mode == 'preview' && matrix.platform != 'mac'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Build ad-hoc signed macOS preview installers
        if: inputs.mode == 'preview' && matrix.platform == 'mac'
        working-directory: desktop
        env:
          CSC_FOR_PULL_REQUEST: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          npm run dist -- --mac --${{ matrix.arch }} -c.mac.identity=- -c.mac.notarize=false
      - name: Build unsigned community installers
        if: inputs.mode == 'community' && matrix.platform != 'mac'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} -c.extraMetadata.agentSwitchRelease=false -c.extraMetadata.agentSwitchCommunityRelease=true
      - name: Build ad-hoc signed macOS community installers
        if: inputs.mode == 'community' && matrix.platform == 'mac'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npm run dist -- --mac --${{ matrix.arch }} -c.mac.identity=- -c.mac.notarize=false -c.extraMetadata.agentSwitchRelease=false -c.extraMetadata.agentSwitchCommunityRelease=true
      - name: Build signed and notarized macOS release
        if: inputs.mode == 'signed' && matrix.platform == 'mac'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then echo "Required release signing secret is missing: $name" >&2; exit 1; fi
          done
          export APPLE_API_KEY="$RUNNER_TEMP/agent-switch-notarization.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_CONTENT
          npm run dist -- --mac --${{ matrix.arch }} -c.forceCodeSigning=true -c.mac.notarize=true -c.extraMetadata.agentSwitchRelease=true -c.extraMetadata.agentSwitchCommunityRelease=false
          codesign --verify --deep --strict "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Agent Switch.app"
          codesign --verify --strict -R 'anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Agent Switch.app"
          xcrun stapler validate "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Agent Switch.app"
      - name: Build signed Windows release
        if: inputs.mode == 'signed' && matrix.platform == 'win'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Required release signing secret is missing: $name" >&2; exit 1; fi
          done
          npm run dist -- --win --x64 -c.forceCodeSigning=true -c.extraMetadata.agentSwitchRelease=true -c.extraMetadata.agentSwitchCommunityRelease=false
      - name: Verify Windows release signatures
        if: inputs.mode == 'signed' && matrix.platform == 'win'
        shell: pwsh
        run: |
          $files = @(
            'desktop/release/win-unpacked/Agent Switch.exe',
            'desktop/release/win-unpacked/resources/backend/agent-switch-backend.exe'
          ) + @(Get-ChildItem desktop/release/*.exe | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            if ((Get-AuthenticodeSignature -FilePath $file).Status -ne 'Valid') {
              throw "Invalid release signature: $file"
            }
          }
      - name: Build Linux release
        if: inputs.mode == 'signed' && matrix.platform == 'linux'
        working-directory: desktop
        run: npm run dist -- --linux --x64 -c.extraMetadata.agentSwitchRelease=true -c.extraMetadata.agentSwitchCommunityRelease=false
      - name: Verify macOS app and distributed bundle signatures
        if: matrix.platform == 'mac'
        working-directory: desktop
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          suffix=""; if [ "$TARGET_ARCH" = arm64 ]; then suffix="-arm64"; fi
          codesign --verify --deep --strict --verbose=2 "release/mac$suffix/Agent Switch.app"
          codesign --verify --strict --verbose=2 "release/mac$suffix/Agent Switch.app/Contents/Resources/backend/agent-switch-backend"
          zip_dir="$(mktemp -d)"
          dmg_mount="$(mktemp -d)"
          trap 'hdiutil detach "$dmg_mount" >/dev/null 2>&1 || true; rm -rf "$zip_dir" "$dmg_mount"' EXIT
          ditto -x -k release/*.zip "$zip_dir"
          codesign --verify --deep --strict --verbose=2 "$zip_dir/Agent Switch.app"
          hdiutil verify release/*.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$dmg_mount" release/*.dmg
          codesign --verify --deep --strict --verbose=2 "$dmg_mount/Agent Switch.app"
      - name: Smoke-test the helper copied into the app
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          case "$TARGET_PLATFORM" in
            mac)
              suffix=""; if [ "$TARGET_ARCH" = arm64 ]; then suffix="-arm64"; fi
              helper="desktop/release/mac$suffix/Agent Switch.app/Contents/Resources/backend/agent-switch-backend" ;;
            win) helper="desktop/release/win-unpacked/resources/backend/agent-switch-backend.exe" ;;
            linux) helper="desktop/release/linux-unpacked/resources/backend/agent-switch-backend" ;;
          esac
          uv run --no-sync python desktop/scripts/smoke_backend.py --disposable-runner --check-tls --check-processes --executable "$helper"
      - name: Verify packaged updater and release metadata
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          args=()
          if [ "$BUILD_MODE" = signed ]; then args+=(--release); fi
          if [ "$BUILD_MODE" = community ]; then args+=(--community); fi
          node desktop/scripts/verify-updates.cjs "$TARGET_PLATFORM" "$TARGET_ARCH" "${args[@]}"
      - name: Smoke-test packaged desktop app
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          DISTRIBUTION: ${{ inputs.mode }}
        run: |
          prefix=()
          if [ "$TARGET_PLATFORM" = linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" node desktop/scripts/smoke_app.cjs "$TARGET_PLATFORM" "$TARGET_ARCH" "$DISTRIBUTION" --disposable-runner --screenshot "$RUNNER_TEMP/app-smoke-$TARGET_PLATFORM-$TARGET_ARCH.png"
      - name: Upload successful app smoke screenshot
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{ runner.temp }}/app-smoke-${{ matrix.platform }}-${{ matrix.arch }}.png
      - name: Stage allowlisted final files and their checksums
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          uv run --no-sync python .github/scripts/desktop_release.py stage --mode "$BUILD_MODE" --source-sha "$GITHUB_SHA" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --input desktop/release --output desktop/release/artifacts
      - name: Attest final native build files
        if: inputs.mode != 'preview'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: desktop/release/artifacts/*
          create-storage-record: false
      - name: Retain and verify the native build attestation
        if: inputs.mode != 'preview'
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          uv run --no-sync python -c 'import os, shutil; shutil.copyfile(os.environ["ATTESTATION_BUNDLE"], "desktop/release/artifacts/attestation-${{ matrix.platform }}-${{ matrix.arch }}.json")'
          uv run --no-sync python .github/scripts/desktop_release.py verify --mode "$BUILD_MODE" --source-sha "$GITHUB_SHA" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --directory desktop/release/artifacts
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: desktop/release/artifacts/*
