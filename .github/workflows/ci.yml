name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-diagnostic:
    name: ${{ matrix.os }}-${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            mode: traced
          - os: ubuntu-latest
            mode: traced
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Trace the original native calls during the full suite
        if: matrix.mode == 'traced'
        timeout-minutes: 5
        run: uv run python -m pytest -p native_process_trace --show-capture=all -rA -o faulthandler_timeout=60
